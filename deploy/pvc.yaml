apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-workspace
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
