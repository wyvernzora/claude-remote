# Template only. Do NOT commit the real credentials.
#
# Produce a credentials.json once by running `claude auth login` on any
# Linux host or in a one-shot container (macOS Claude stores in Keychain
# and won't write the file):
#
#   docker run --rm -it --entrypoint bash ghcr.io/OWNER/claude-remote:TAG
#   # inside:
#   #   claude auth login
#   #   cat ~/.claude/.credentials.json    # capture this content
#   #   exit
#
# Create the Secret directly from the file:
#
#   kubectl create secret generic claude-oauth \
#     --from-file=credentials.json=/path/to/.credentials.json
#
# Or use sealed-secrets / external-secrets if you need it in git.
#
# Note on rotation: the Secret is mounted read-only at
# /var/run/secrets/claude/credentials.json. The entrypoint copies it
# once into the writable state volume at ~/.claude/.credentials.json,
# where claude can refresh access tokens in place. To force a re-seed
# (e.g. after rotation), delete .credentials.json from the state PVC
# and restart the pod.
apiVersion: v1
kind: Secret
metadata:
  name: claude-oauth
type: Opaque
stringData:
  credentials.json: |
    REPLACE_WITH_CREDENTIALS_JSON_CONTENT
